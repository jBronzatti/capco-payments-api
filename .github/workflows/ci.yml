name: CI

# Branches flow feature/* → develop → main, and every push to them is checked. A pull request from a feature/*
# branch of this repository is already covered by that branch's push run, so its pull-request jobs are skipped;
# pull requests from forks or from other branches run in full. A merge result is checked when it is pushed to
# develop or main. GitHub reports a skipped job as successful, so don't make these jobs required checks for
# same-repository feature/* pull requests.
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

# Read-only token: the workflow checks code, it never writes to the repository.
permissions:
  contents: read

# One group per pull request or per ref: a newer run cancels an older one for the same PR or branch only.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECKPOINT_DISABLE: '1'
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    name: Lint, types, format, unit tests, build, runtime audit
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The whole dependency tree, development tooling included (see the overrides note in the README).
      - run: npm audit --audit-level=high

  database-tests:
    name: Integration and e2e tests (PostgreSQL via Testcontainers)
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int
      - run: npm run test:e2e

  secret-scan:
    name: Secret scan (full history)
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
